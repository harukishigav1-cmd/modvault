<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — ModVault</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
